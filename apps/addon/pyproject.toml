[project]
name = "caremerge-addon"
version = "0.1.0"
description = "CareMerge Alexa+ add-on: MCP tools over the care-plan pipeline"
requires-python = ">=3.12"
dependencies = [
    "caremerge-core",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
caremerge-core = { workspace = true }

[project.scripts]
caremerge-addon = "caremerge_addon.cli:main"
