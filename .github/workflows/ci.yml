name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tags, so pin a release commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type-check
        run: uv run mypy packages/caremerge-core/src apps/addon/src apps/simulator/src
      - name: Test
        run: uv run pytest
      - name: Check the web app's copy of the simulator API document
        run: uv run caremerge-sim openapi | diff -u apps/web/src/api/openapi.json -

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Check the generated API types
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Build
        run: pnpm build
